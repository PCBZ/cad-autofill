name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # requirements-fill.txt is what the Candata computer installs, so this job
      # also checks that it installs on Windows. CrewAI (requirements-extract.txt)
      # is left out until a test needs it.
      - run: python -m pip install -r requirements-fill.txt -r requirements-gmail-test.txt
      - run: python -m unittest discover -s tests -v
