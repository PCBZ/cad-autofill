name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      # requirements-test.txt includes requirements-fill.txt, which the Candata computer
      # installs, so this job also checks that it installs on Windows.
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - run: python -m pip install -r requirements-lint.txt
      - run: ruff format --check --diff .
